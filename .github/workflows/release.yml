name: Release v1.0.0

# Einmaliger Ablauf: baut die Offline-Pakete aus dem Stand von main nach PR #18,
# legt den Tag v1.0.0 an und veröffentlicht das Release mit beiden Paketen.
on:
  push:
    branches: [claude/project-thread-okgthr]
    paths: ['.github/workflows/release.yml', '.release/**']

permissions:
  contents: write

env:
  TAG: v1.0.0
  TARGET: 6f5f6319c3ca8a7ce04ef620ea6066032dc7e066

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release-Stand auschecken
        run: git worktree add --detach "$RUNNER_TEMP/src" "$TARGET"
      - name: Offline-Pakete bauen und prüfen
        run: .release/build.sh "$RUNNER_TEMP/src" "$RUNNER_TEMP/out"
      - name: Tag und Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "v1.0.0 · Teil 1 « L'affaire du pain perdu » und Teil 2 « Le guide fantôme »" \
            --notes-file .release/notes.md \
            --latest \
            "$RUNNER_TEMP/out/pain-perdu_offline.zip" \
            "$RUNNER_TEMP/out/pain-perdu_deutsch_offline.zip"
          gh release view "$TAG"
